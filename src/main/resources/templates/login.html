<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail FSTG - Connexion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #fff; width: 380px; padding: 35px 30px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo h1 { color: #1e3c72; font-size: 24px; font-weight: bold; }
        .logo p { color: #777; font-size: 13px; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #333; }
        input[type="text"], input[type="password"] { width: 100%; padding: 11px 14px; border: 1.5px solid #dcdcdc; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #2a5298; }
        button { width: 100%; padding: 12px; background: #1e3c72; border: none; border-radius: 6px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 5px; }
        button:hover { background: #162b50; }
        .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 18px; font-size: 13px; text-align: center; }
        .alert-error { background-color: #fde8e8; color: #c81e1e; border: 1px solid #f8b4b4; }
        .alert-success { background-color: #def7ec; color: #03543f; border: 1px solid #84e1bc; }
        .credentials-hint { margin-top: 20px; background: #f8fafc; padding: 10px; border-radius: 6px; font-size: 12px; color: #475569; }
        .credentials-hint strong { color: #1e293b; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>PORTAIL FSTG</h1>
        <p>Service d'Authentification Centralisé</p>
    </div>

    <!-- Message d'erreur -->
    <div th:if="${param.error}" class="alert alert-error">
        ⚠️ Identifiant ou mot de passe incorrect.
    </div>

    <!-- Message de déconnexion -->
    <div th:if="${param.logout}" class="alert alert-success">
        ✓ Déconnexion effectuée avec succès.
    </div>

    <form th:action="@{/authenticate}" method="post">
        <div class="form-group">
            <label for="username">Identifiant (Email / Nom d'utilisateur)</label>
            <input type="text" id="username" name="username" placeholder="ex: etudiant_fstg" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit">Se connecter</button>
    </form>

    <div class="credentials-hint">
        💡 <strong>Comptes de test (TP) :</strong><br>
        • Admin : <code>admin_fstg</code> / <code>admin2026</code><br>
        • Étudiant : <code>etudiant_fstg</code> / <code>fstg2026</code>
    </div>
</div>
</body>
</html>
