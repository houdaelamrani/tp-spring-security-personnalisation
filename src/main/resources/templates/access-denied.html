<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403 - Accès Refusé</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .card-error { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); max-width: 480px; }
        .code { font-size: 72px; font-weight: 800; color: #ef4444; line-height: 1; }
        h2 { color: #1e293b; margin: 15px 0 10px; }
        p { color: #64748b; font-size: 15px; margin-bottom: 25px; }
        .btn-back { display: inline-block; background: #1e3c72; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="card-error">
    <div class="code">403</div>
    <h2>Accès Refusé</h2>
    <p>Désolé, vos privilèges actuels ne vous permettent pas d'accéder à cette section d'administration.</p>
    <a th:href="@{/user/dashboard}" class="btn-back">Retourner à mon Espace</a>
</div>
</body>
</html>
